name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: termos-windows-x64.exe
          - os: ubuntu-latest
            artifact: termos-linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PyInstaller
        run: pip install pyinstaller
      - name: Build binary
        run: >
          pyinstaller --onefile --console --clean
          --name termos --paths termos
          termos/main.py
      - name: Stage artifact
        shell: bash
        run: |
          mkdir -p release
          if [ -f dist/termos.exe ]; then
            mv dist/termos.exe "release/${{ matrix.artifact }}"
          else
            mv dist/termos "release/${{ matrix.artifact }}"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: release/${{ matrix.artifact }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x artifacts/termos-linux-x64
          gh release create "${{ github.ref_name }}" \
            artifacts/termos-windows-x64.exe \
            artifacts/termos-linux-x64 \
            --repo "${{ github.repository }}" \
            --title "TERMOS ${{ github.ref_name }}" \
            --notes "$(cat <<'EOF'
          Standalone TERMOS binaries — no Python install required.

          **Windows:** download `termos-windows-x64.exe` and run it (double-click or from a terminal).
          **Linux:** `chmod +x termos-linux-x64 && ./termos-linux-x64`

          Default logins: `root` / `root`, `guest` / `guest`.

          Windows may show a SmartScreen warning because the executable is unsigned; choose "More info" → "Run anyway".
          EOF
          )"
